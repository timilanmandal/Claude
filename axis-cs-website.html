<!DOCTYPE html>
<html lang="en">

<meta name="theme-color" content="#060F19">

<meta property="og:title" content="Axis Consulting and Strategy (ACS)">
<meta property="og:description" content="The first political consultancy, campaign management and political management firm in Bangladesh.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060F19'/%3E%3Cpath d='M16 5l11 11-11 11L5 16z' fill='none' stroke='%23C39A51' stroke-width='2.2'/%3E%3Cpath d='M16 12l4 4-4 4-4-4z' fill='%23E4C27F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300..700&family=IBM+Plex+Mono:wght@400;500&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
:root{
  color-scheme:light;
  --n9:#060F19;--n8:#0A1726;--n7:#0F2136;--n6:#173049;--nl:#22405F;
  --on:#EAF0F5;--on2:#B3C3D2;--on3:#7F93A7;
  --paper:#F2F4F6;--white:#FFFFFF;--ink:#0B1826;--ink2:#394C5F;--muted:#627386;--line:#D7DEE5;--line2:#E6EBF0;
  --gold:#C39A51;--goldhi:#E4C27F;--goldtx:#83601F;--goldbg:#F4ECDD;
  --serif:"Tiro Bangla","Noto Serif Bengali",Georgia,"Times New Roman",serif;
  --sans:"Anek Bangla","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --wrap:1220px;--hh:72px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
.skip{position:fixed;left:16px;top:-80px;z-index:100;background:var(--gold);color:var(--n9);padding:12px 18px;font-weight:600;text-decoration:none;border-radius:2px;transition:top .2s}
.skip:focus{top:12px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#app:focus{outline:none}
html[lang="bn"] body{font-size:18px;line-height:1.72}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;line-height:1.14;text-wrap:balance}
p{margin:0}
em{font-style:italic;color:var(--goldhi)}
html[lang="bn"] em{font-style:normal}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:28px}
@media (max-width:560px){.wrap{padding-inline:16px}}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldtx);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:26px;height:1px;background:currentColor}
.dark .eyebrow{color:var(--gold)}
html[lang="bn"] .eyebrow{font-family:var(--sans);font-size:14.5px;letter-spacing:.02em;font-weight:500}
.h2{font-size:clamp(32px,3.9vw,50px)}
.lead{font-size:19px;color:var(--ink2);max-width:60ch}
.dark{background:var(--n8);color:var(--on)}
.dark .lead{color:var(--on2)}
.sec{padding-block:104px}
@media (max-width:900px){.sec{padding-block:68px}}
.ph{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldtx);background:var(--goldbg);padding:2px 8px;border-radius:2px;margin-left:8px;vertical-align:2px;white-space:nowrap}
html[lang="bn"] .ph{font-family:var(--sans);font-size:12px;letter-spacing:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:12px;font:500 15.5px/1 var(--sans);padding:16px 24px;border-radius:2px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn .ar{transition:transform .2s}
.btn:hover .ar{transform:translateX(4px)}
.btn.gold{background:var(--gold);color:var(--n9);border-color:var(--gold)}
.btn.gold:hover{background:var(--goldhi);border-color:var(--goldhi)}
.btn.line{border-color:var(--nl);color:var(--on)}
.btn.line:hover{border-color:var(--gold);color:var(--goldhi)}
.btn.ink{background:var(--ink);color:var(--white)}
.btn.ink:hover{background:var(--n6)}
.tlink{display:inline-flex;align-items:center;gap:10px;font-weight:500;text-decoration:none;color:var(--goldtx);border-bottom:1px solid currentColor;padding-bottom:3px}
.dark .tlink{color:var(--goldhi)}
.tlink:hover{gap:14px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(6,15,25,.94);backdrop-filter:blur(10px) saturate(1.2);border-bottom:1px solid rgba(195,154,81,.28);color:var(--on)}
.top>.wrap{display:flex;align-items:center;gap:28px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:.14em}
.brand .wm small{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--gold);margin-top:5px}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav a{text-decoration:none;font-size:14.5px;color:var(--on2);padding:9px 11px;border-radius:2px;position:relative;white-space:nowrap}
.nav a:hover{color:var(--on)}
.nav a[aria-current="page"]{color:var(--on)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:1px;background:var(--gold)}
.tools{display:flex;align-items:center;gap:14px;flex:none}
.lang{display:inline-flex;border:1px solid var(--nl);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--on3);font:500 12.5px/1 var(--sans);padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--n9)}
.top .btn{padding:12px 16px;font-size:14px}
/* Inline nav is crowded between 1141 and 1420px; below 1140 the nav moves to the subnav row and the CTA has room again. */
@media (min-width:1141px) and (max-width:1420px){.top .btn{display:none}}
@media (max-width:760px){.top .btn{display:none}}
@media (max-width:1140px){
  :root{--hh:116px}
  .top>.wrap{min-height:64px}
  .nav{display:none}
  .tools{margin-left:auto}
}
@media (max-width:560px){:root{--hh:110px}.top>.wrap{min-height:58px}}

.subnav{display:none;border-top:1px solid var(--n6)}
@media (max-width:1140px){.subnav{display:block}}
.subnav .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:6px;scrollbar-width:none;scroll-behavior:smooth}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav.more-r .wrap{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.subnav.more-l .wrap{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
.subnav.more-l.more-r .wrap{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.subnav a{flex:none;text-decoration:none;font-size:14px;color:var(--on2);padding:8px 12px;border-radius:999px;white-space:nowrap}
.subnav a:hover{color:var(--on)}
.subnav a[aria-current="page"]{background:var(--gold);color:var(--n9)}
.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.xtile{display:flex;flex-direction:column;gap:14px;padding:34px 30px;background:var(--n8);color:var(--on);text-decoration:none;min-height:280px;position:relative;overflow:hidden;transition:transform .25s}
.xtile::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid var(--nl);transform:rotate(45deg);transition:border-color .3s}
.xtile:hover{transform:translateY(-4px)}
.xtile:hover::after{border-color:var(--gold)}
.xtile .k{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
html[lang="bn"] .xtile .k{font-family:var(--sans);font-size:14px;letter-spacing:0;text-transform:none}
.xtile h3{font-size:28px;max-width:16ch}
.xtile p{color:var(--on2);font-size:16px}
.xtile .go{margin-top:auto;color:var(--goldhi);font-weight:500;display:flex;gap:10px;align-items:center}
@media (max-width:900px){.explore{grid-template-columns:1fr}.xtile{min-height:0}}
.nextbar{border-top:1px solid var(--line);background:var(--white)}
.nextbar a{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-block:40px;text-decoration:none}
.nextbar .k{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldtx)}
html[lang="bn"] .nextbar .k{font-family:var(--sans);font-size:14px;letter-spacing:0;text-transform:none}
.nextbar h2{font-size:clamp(28px,3.4vw,42px);margin-top:8px}
.nextbar .arr{width:64px;height:64px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;transition:background .2s,color .2s,border-color .2s}
.nextbar a:hover .arr{background:var(--gold);border-color:var(--gold);color:var(--n9)}
.ico{color:var(--gold);flex:none;display:inline-block;vertical-align:middle}
.lmark{height:42px;width:auto;display:block}
.brand .wm{border-left:1px solid var(--nl);padding-left:12px;gap:4px}
.brand .wm small{margin-top:0;color:var(--on2);font-size:9.5px;letter-spacing:.2em}
@media (max-width:560px){.brand .wm{display:none}.lmark{height:34px}}
.flogo{width:300px;max-width:100%;height:auto;display:block}
.fgrid .about{margin-top:14px}
.hero .wrap.stw{display:block;padding-block:0}
.stats1{border-top:1px solid var(--nl);padding-block:22px 30px}
.stats1 h2{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:14px}
.stats1 h2::after{content:"";flex:1;height:1px;background:var(--nl)}
html[lang="bn"] .stats1 h2{font-family:var(--sans);font-size:14.5px;letter-spacing:0;text-transform:none}
@media (max-width:420px){.stats1 h2{font-size:10px;letter-spacing:.1em}}
.srow{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}
.srow .stat{padding:4px 20px;border-left:1px solid var(--nl);border-top:0}
.srow .stat:first-child{border-left:0;padding-left:0}
@media (max-width:640px){.srow .stat{padding:2px 8px}.srow .stat b{font-size:26px}.srow .stat span{font-size:11.5px;line-height:1.3}}
.axis{background:var(--white);border-bottom:1px solid var(--line);padding-block:72px 64px}
.axhead{margin-bottom:40px}
.axhead .h2{margin-top:16px}
.axrow{display:grid;grid-template-columns:repeat(4,1fr);position:relative;border-top:1px solid var(--ink)}
.axc{padding:26px 22px 4px 0;display:flex;flex-direction:column;gap:10px;position:relative}
.axc::before{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.axl{font-family:var(--serif);font-size:clamp(64px,7vw,96px);line-height:.9;color:var(--ink)}
.axw{font-size:18px;color:var(--ink2);font-weight:500}
.axw b{color:var(--goldtx);font-weight:700}
.axb{font-size:16px;color:var(--muted)}
@media (max-width:760px){.axrow{grid-template-columns:1fr 1fr;row-gap:24px}}
.firstx{padding-block:72px 24px}
.fxcard{display:grid;grid-template-columns:1.25fr 1fr;background:var(--n8);color:var(--on);position:relative;overflow:hidden}
.fxcard::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(179,195,210,.14) 1px,transparent 1.4px);background-size:16px 16px;mask-image:linear-gradient(90deg,transparent 45%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 45%,#000)}
.fxl{padding:48px;display:grid;gap:16px;border-left:3px solid var(--gold);position:relative}
.fxl h2{font-size:clamp(26px,2.8vw,36px);color:var(--on)}
.fxl p:last-child{color:var(--on2);max-width:54ch}
.fxr{display:grid;grid-template-columns:1fr 1fr;position:relative}
.fxs{padding:26px 28px;border-left:1px solid var(--nl);border-bottom:1px solid var(--nl);display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-content:center}
.fxs:nth-child(n+3){border-bottom:0}
.fxs .ico{grid-row:span 2;margin-top:6px}
.fxs b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;color:var(--goldhi);font-variant-numeric:tabular-nums}
.fxs span{font-size:13.5px;color:var(--on2);margin-top:6px}
@media (max-width:900px){.fxcard{grid-template-columns:1fr}.fxl{padding:32px 24px}.fxs{border-top:1px solid var(--nl);padding:20px}}
.pic{width:48px;height:48px;border:1px solid var(--line);display:grid;place-items:center;background:var(--paper);transition:background .25s,border-color .25s}
.pic.sm{width:38px;height:38px;align-self:center}
.pcard:hover .pic{background:rgba(195,154,81,.12);border-color:var(--gold)}
.svc-meta .pic{margin-bottom:16px}
.dgroup-h{align-items:center}
.dix{display:inline-flex;align-items:center;gap:10px}
.prin .pic{margin-bottom:4px}
.rung .tn{width:60px;height:60px;border:1px solid var(--line);display:grid;place-items:center;background:var(--paper)}
.panel .k{display:inline-flex;align-items:center;gap:10px}
.stagebtns button{display:inline-flex;align-items:center;gap:8px}
.mm{padding-block:88px}
.mmgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
.mmgrid>*{min-width:0}
.mmsteps{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.mmsteps li{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--nl);padding:8px 13px;border-radius:999px;font-size:14.5px;color:var(--on2)}
.miniloop{display:block;text-decoration:none;border:1px solid var(--nl);background:rgba(6,15,25,.5);padding:18px 18px 16px;transition:border-color .25s,transform .25s}
.miniloop:hover{border-color:var(--gold);transform:translateY(-3px)}
.miniloop svg{width:100%;height:auto;display:block}
.miniloop .ml{fill:var(--on2);font:500 14px var(--sans)}
.miniloop .mnum{fill:var(--on);font:500 11px var(--mono);text-anchor:middle}
.miniloop .mn{fill:#0A1726;stroke:#22405F;stroke-width:1.5;animation:mnode 10s linear infinite}
@keyframes mnode{0%,17%{fill:#C39A51;stroke:#E4C27F}20%,100%{fill:#0A1726;stroke:#22405F}}
.miniloop .marc{animation:marc 10s linear infinite}
@keyframes marc{to{stroke-dashoffset:0}}
.mlhint{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px;font-size:14px;color:var(--goldhi)}
@media (max-width:900px){.mmgrid{grid-template-columns:1fr}}
.aisec{background:linear-gradient(180deg,var(--paper),#E9EDF1)}
.aiviz{background:var(--n8);border:1px solid var(--n6);padding:28px 24px 18px;position:relative;overflow:hidden}
.aiviz::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(34,64,95,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(34,64,95,.35) 1px,transparent 1px);background-size:40px 40px;opacity:.45;pointer-events:none}
.aibox{overflow-x:auto;position:relative}
.aisvg{width:100%;min-width:620px;height:auto;display:block}
.aisvg .aie{stroke:#22405F;stroke-width:1;transition:stroke .5s,stroke-width .5s}
.aisvg .aie.lit{stroke:#C39A51;stroke-width:1.6;transition:none}
.aisvg.focus .aie{stroke:#17304A}
.aisvg.focus .aie.lit{stroke:#E4C27F}
.aisvg .ain{fill:#0F2136;stroke:#3A5C80;stroke-width:1.4;transition:fill .4s,stroke .4s}
.aisvg .ain.hit{fill:#E4C27F;stroke:#E4C27F;transition:none}
.aisvg .aiport{fill:#0A1726;stroke:#C39A51;stroke-width:1.8;transition:fill .5s}
.aisvg .aiin{cursor:pointer}
.aisvg .aiin text,.aisvg .aiout text{fill:#B3C3D2;font:500 19px var(--sans)}
.aisvg .aiin:hover text,.aisvg .aiin.on text{fill:#E4C27F}
.aisvg .aiin.on .aiport{fill:#C39A51}
.aisvg .aiout.hit .aiport{fill:#E4C27F;transition:none}
.aisvg .aiout.hit text{fill:#EAF0F5}
.aisvg .aip{fill:#F3DDAE;filter:drop-shadow(0 0 4px rgba(228,194,127,.9))}
.aisvg .aicap{fill:#C39A51;font:500 12px var(--mono);letter-spacing:.2em;text-anchor:middle}
.aisvg .aicol{fill:#7F93A7;font:500 12px var(--mono);letter-spacing:.16em}
html[lang="bn"] .aisvg .aicap,html[lang="bn"] .aisvg .aicol{font:500 15px var(--sans);letter-spacing:0}
.aihint{position:relative;display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--on2)}
.wsband{background:var(--n7);color:var(--on);padding-block:64px;border-top:1px solid var(--n6)}
.wshead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 32px;margin-bottom:32px}
.wshead .eyebrow{width:100%}
.wshead h2{font-size:clamp(26px,3vw,38px);max-width:24ch}
.tchips{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tchip{display:flex;flex-direction:column;gap:8px;padding:18px 16px;border:1px solid var(--nl);text-decoration:none;background:rgba(6,15,25,.35);transition:border-color .2s,background .2s}
.tchip:hover{border-color:var(--gold);background:rgba(195,154,81,.08)}
.tchip b{font-family:var(--mono);font-weight:500;font-size:17px;letter-spacing:.08em;color:var(--on)}
.tchip span{font-size:13px;color:var(--on2);line-height:1.35}
@media (max-width:1000px){.tchips{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.tchips{grid-template-columns:repeat(2,1fr)}}
.abrand{background:var(--n9);padding-block:48px;border-bottom:1px solid var(--n6)}
.abrand img{width:560px;max-width:100%;height:auto;display:block;margin-inline:auto}


/* v5: compact stats */
.stats1{padding-block:16px 22px}
.stats1 h2{font-size:11px}
.srow{margin-top:12px}
.srow .stat{display:flex;align-items:baseline;gap:10px;padding:2px 18px}
.srow .stat b{font-size:30px}
.srow .stat span{margin-top:0;font-size:13.5px;line-height:1.3}
@media (max-width:640px){.srow .stat{flex-direction:column;gap:2px;padding:2px 8px}.srow .stat b{font-size:22px}.srow .stat span{font-size:11px}}
.srow{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:420px){.srow{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.srow .stat:nth-child(3){border-left:0;padding-left:0}.srow .stat b{font-size:24px}.srow .stat span{font-size:12.5px}}
/* v5: AXIS band */
.axis2{background:radial-gradient(700px 420px at 24% 50%,rgba(195,154,81,.16),rgba(6,15,25,0) 70%),linear-gradient(180deg,#07121E,#060F19);color:var(--on);padding-block:96px;border-top:1px solid rgba(195,154,81,.25);border-bottom:1px solid rgba(195,154,81,.25);position:relative;overflow:hidden}
.axis2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(34,64,95,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(34,64,95,.25) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 50%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 30% 50%,#000 10%,transparent 70%)}
.ax2{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;position:relative}
.ax2>*{min-width:0}
.ax2logo{position:relative;padding:48px 36px;border:1px solid rgba(195,154,81,.28);background:rgba(6,15,25,.55)}
.ax2logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 40px rgba(195,154,81,.18))}
.ax2logo .k{position:absolute;width:18px;height:18px;border:0 solid var(--gold)}
.ax2logo .k1{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.ax2logo .k2{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}

@media (max-width:900px){.ax2{grid-template-columns:1fr;gap:44px}.axis2{padding-block:64px}.ax2logo{padding:28px 20px}.ax2L{font-size:52px}.ax2list li{grid-template-columns:60px 1fr}}
/* v5: compact practice cards */
.pcard{padding:24px 24px 22px;gap:10px}
.pchd{display:flex;align-items:center;gap:14px}
.pchd .pic{width:42px;height:42px}

.pcard p{font-size:15px}
.pcard .code{font-size:11px}
.pcard .more{padding-top:8px;font-size:14px}
/* v5: AI flow */
.fa{position:relative;background:var(--n8);border:1px solid var(--n6);padding:28px 28px 20px;overflow:hidden}
.fa::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(34,64,95,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(34,64,95,.3) 1px,transparent 1px);background-size:40px 40px;opacity:.4;pointer-events:none}
.fa-lines{position:absolute;left:0;top:0;pointer-events:none;z-index:1}

.fa-p.on{stroke:#C39A51;stroke-width:2}
.fa-pk{fill:#F3DDAE;filter:drop-shadow(0 0 4px rgba(228,194,127,.9))}
.fa-cols{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:88px;align-items:stretch}
.fa-col{display:grid;grid-template-rows:auto 1fr}
.fa-col>.fa-list,.fa-col>.fa-eng{align-self:center}
.fa-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--on3);margin-bottom:12px}

.fa-list{display:grid;gap:10px}
.fa-src{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--nl);background:rgba(6,15,25,.6);color:var(--on2);padding:14px 16px;font-size:16px;cursor:pointer;transition:border-color .25s,background .25s,color .25s;position:relative}
.fa-src:hover{border-color:var(--gold);color:var(--on)}
.fa-src.on{border-color:var(--gold);background:rgba(195,154,81,.14);color:var(--on)}
.fa-dot{position:absolute;right:-5px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--n8);border:1.5px solid var(--nl)}
.fa-src.on .fa-dot{background:var(--gold);border-color:var(--goldhi)}
.fa-act{display:flex;align-items:center;gap:10px;border:1px solid var(--nl);background:rgba(6,15,25,.6);color:var(--on3);padding:11px 14px;font-size:15px;position:relative;transition:all .35s}
.fa-act .ico{color:var(--on3);transition:color .35s}
.fa-act .fa-dot{left:-5px;right:auto}
.fa-act.on{border-color:var(--gold);color:var(--on);background:rgba(195,154,81,.12)}
.fa-act.on .ico{color:var(--goldhi)}
.fa-act.on .fa-dot{background:var(--gold);border-color:var(--goldhi)}
.fa-eng{position:relative;border:1px solid rgba(195,154,81,.45);background:linear-gradient(180deg,#0F2136,#0A1726);padding:22px 20px 18px;overflow:hidden;box-shadow:0 0 0 6px rgba(195,154,81,.05)}
.fa-eng img{width:96px;height:auto;display:block;margin:0 auto 14px}
.fa-eng ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fa-eng li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--on2);padding:8px 10px;border:1px solid var(--n6);background:rgba(6,15,25,.5)}
.fa-n{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--goldhi);flex:none}
.fa-eng.run li{animation:engstep 1.8s ease both}
.fa-eng.run li:nth-child(2){animation-delay:.3s}
.fa-eng.run li:nth-child(3){animation-delay:.6s}
@keyframes engstep{0%{border-color:var(--n6)}30%{border-color:var(--gold);color:var(--on)}100%{border-color:var(--n6)}}
.fa-scan{position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(180deg,transparent,rgba(228,194,127,.14),transparent);animation:scan 3s linear infinite}
@keyframes scan{to{top:100%}}
.fa-read{position:relative;z-index:2;margin-top:24px;display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:14px;align-items:start;border-top:1px solid var(--nl);padding-top:18px}
.fa-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--n9);background:var(--gold);padding:4px 8px;align-self:start;white-space:nowrap}
html[lang="bn"] .fa-tag{font-family:var(--sans);font-size:12px;letter-spacing:0}
.fa-r b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:4px}
html[lang="bn"] .fa-r b{font-family:var(--sans);font-size:13.5px;letter-spacing:0}
.fa-r p{font-size:15px;color:var(--on);line-height:1.45}
.fa-arr{color:var(--gold);font-size:18px;padding-top:14px}
.fa .aihint{position:relative;z-index:2;margin-top:14px}
@media (max-width:1000px){.fa-cols{gap:56px}}
@media (max-width:760px){.fa{padding:20px 16px}.fa-cols{grid-template-columns:1fr;gap:18px}.fa-mid{order:0}.fa-read{grid-template-columns:1fr}.fa-arr{display:none}.fa-dot{display:none}}


/* Page transitions */
.page{animation:pin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pin{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 78% 30%,#12304D 0%,rgba(10,23,38,0) 60%),linear-gradient(180deg,var(--n9),var(--n8))}
.hero .wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center;padding-block:64px 40px}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(195,154,81,.45);background:rgba(195,154,81,.08);color:var(--goldhi);padding:7px 14px 7px 10px;border-radius:999px;font-size:13.5px;font-weight:500}
.badge i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:block;box-shadow:0 0 0 4px rgba(195,154,81,.18)}
.hero h1{font-size:clamp(40px,5.6vw,74px);line-height:1.06;margin-top:26px;letter-spacing:-.01em}

.intro{margin-top:28px;display:grid;gap:12px;max-width:60ch}

.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.mapbox{position:relative;height:clamp(460px,52vw,640px)}

.maplabel{position:absolute;left:0;bottom:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--on3);display:flex;flex-direction:column;gap:6px;max-width:260px}
.maplabel b{font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:0;color:var(--on);line-height:1.3}
html[lang="bn"] .maplabel{font-family:var(--sans);font-size:13px;letter-spacing:0}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--on3)}
html[lang="bn"] .legend{font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend .d1{width:6px;height:6px;border-radius:50%;background:var(--goldhi)}
.legend .d2{width:10px;height:10px;border:1.5px solid var(--gold);transform:rotate(45deg)}
.stats{border-top:1px solid var(--nl);display:grid;grid-template-columns:auto repeat(4,1fr);align-items:stretch}
.stats h2{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on3);padding:28px 36px 28px 0;max-width:230px;line-height:1.6;display:flex;align-items:center}

.stat{padding:26px 24px;border-left:1px solid var(--nl)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;color:var(--on);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:8px;font-size:14px;color:var(--on2)}
@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;padding-block:48px 24px}

/* Section heads */
.shead{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:end;margin-bottom:56px}

/* First band */
.first .wrap{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}

/* Practice cards */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pcard{background:var(--white);padding:34px 30px 30px;display:flex;flex-direction:column;gap:14px;text-decoration:none;position:relative;transition:background .25s,color .25s}
.pcard .code{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--goldtx);display:flex;justify-content:space-between}
.pcard h3{font-size:27px}
.pcard p{color:var(--muted);font-size:16px;line-height:1.55}
.pcard .more{margin-top:auto;padding-top:14px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:10px;color:var(--ink)}

@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.pgrid{grid-template-columns:1fr}}

/* Stage strip (home) */
.strip{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.strip::before{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:var(--nl)}
.strip::after{content:"";position:absolute;top:3px;left:0;width:90px;height:5px;background:linear-gradient(90deg,rgba(228,194,127,0),var(--goldhi));border-radius:3px;animation:run 6s linear infinite}
@keyframes run{from{left:0}to{left:calc(100% - 90px)}}
.strip li{padding:34px 24px 0 0;position:relative}
.strip li::before{content:"";position:absolute;top:1px;left:0;width:9px;height:9px;background:var(--n8);border:1.5px solid var(--gold);transform:rotate(45deg)}
.strip .n{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--gold)}
.strip h3{font-size:25px;margin:10px 0 10px;color:var(--on)}
.strip p{font-size:15.5px;color:var(--on2);line-height:1.55}
@media (max-width:900px){
  .strip{grid-template-columns:1fr;gap:0}
  .strip::before{left:4px;right:auto;top:0;bottom:0;width:1px;height:auto}
  .strip::after{display:none}
  .strip li{padding:0 0 30px 34px}
  .strip li::before{top:6px}
}

/* Tech strip */
.tstrip{display:grid;grid-template-columns:1fr 1.4fr;gap:64px;align-items:start}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:0 36px}

@media (max-width:900px){.tstrip{grid-template-columns:1fr;gap:32px}}
@media (max-width:600px){.tlist{grid-template-columns:1fr}}

/* Tiers */
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:0 56px;counter-reset:t}
.tier{display:grid;grid-template-columns:170px 1fr;gap:20px;padding-block:24px;border-top:1px solid var(--line);align-items:baseline}
.tier .lv{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldtx)}
html[lang="bn"] .tier .lv{font-family:var(--sans);font-size:15px;letter-spacing:0;font-weight:600}
.tier p{font-family:var(--serif);font-size:22px;line-height:1.35}
@media (max-width:900px){.tiers{grid-template-columns:1fr}}
@media (max-width:520px){.tier{grid-template-columns:1fr;gap:6px}}
.ladder{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:72px 1fr;gap:22px;align-items:center;background:var(--white);border:1px solid var(--line);padding:22px 26px;transition:border-color .2s,transform .2s}
.rung:hover{border-color:var(--gold);transform:translateX(4px)}
.rung .tn{font-family:var(--serif);font-size:40px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.rung h3{font-size:22px}
.rung p{font-size:15.5px;color:var(--muted);margin-top:2px}
.rung .lv{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--goldtx)}
html[lang="bn"] .rung .lv{font-family:var(--sans);font-size:14px;letter-spacing:0;font-weight:600}

/* CTA band */
.cta{background:linear-gradient(135deg,var(--n8),var(--n7));border-top:1px solid rgba(195,154,81,.35)}

.cta h2{font-size:clamp(28px,3.4vw,44px);max-width:22ch;color:var(--on)}

/* Page head (inner pages) */
.phead{background:radial-gradient(900px 400px at 85% 0%,#153050 0%,rgba(10,23,38,0) 70%),var(--n8);color:var(--on);position:relative;overflow:hidden}
.phead::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(179,195,210,.16) 1px,transparent 1.4px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent 35%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 100%)}
.phead .wrap{position:relative;padding-block:64px 60px}
.crumbs{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--on3);display:flex;gap:10px;align-items:center}

.phead h1{font-size:clamp(36px,5vw,64px);margin-top:22px;max-width:20ch}
.phead .lead{margin-top:22px;color:var(--on2)}

/* Services page */
.svc-sec{display:grid;grid-template-columns:320px 1fr;gap:48px;padding-block:56px;border-top:1px solid var(--line)}

.svc-meta .code{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--goldtx)}
.svc-meta h2{font-size:32px;margin:12px 0 12px}
.svc-meta p{color:var(--muted);font-size:16px}
.svc-meta .cnt{margin-top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
html[lang="bn"] .svc-meta .cnt{font-family:var(--sans);font-size:14px;letter-spacing:0}
.seeall{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--n8);color:var(--on);text-decoration:none;padding:15px 20px;font-weight:500;font-size:15.5px;margin-bottom:6px;transition:background .2s}

.dgrid{display:grid;grid-template-columns:260px 1fr;gap:64px;align-items:start}
.dindex{position:sticky;top:calc(var(--hh) + 24px);display:grid;gap:2px}

.dentry .no{font-family:var(--mono);font-size:13px;color:var(--goldtx);padding-top:6px;font-variant-numeric:tabular-nums}
.dentry h3{font-size:24px;margin-bottom:8px}

/* Methodology */

.loopsvg .node.on circle{fill:var(--gold);stroke:var(--goldhi)}

var aiRaf = 0, aiTimer = 0, aiRO = null;
function initAI(){
  var box = document.querySelector(".fa"); if (!box) return;
  var svg = box.querySelector(".fa-lines"), NS = "http://www.w3.org/2000/svg";
  var srcs = box.querySelectorAll(".fa-src"), acts = box.querySelectorAll(".fa-act"), eng = box.querySelector(".fa-eng");
  var cur = 0, user = false;
  function pt(el, side){ var b = box.getBoundingClientRect(), r = el.getBoundingClientRect(); return [ (side==="r" ? r.right : r.left) - b.left, r.top + r.height/2 - b.top ]; }
  function curve(a,b){ var dx = (b[0]-a[0])*0.5; return "M"+a[0].toFixed(1)+" "+a[1].toFixed(1)+" C"+(a[0]+dx).toFixed(1)+" "+a[1].toFixed(1)+" "+(b[0]-dx).toFixed(1)+" "+b[1].toFixed(1)+" "+b[0].toFixed(1)+" "+b[1].toFixed(1); }
  function draw(){
    var b = box.getBoundingClientRect(); svg.setAttribute("viewBox","0 0 "+b.width+" "+b.height); svg.setAttribute("width",b.width); svg.setAttribute("height",b.height);
    if (window.innerWidth < 760){ svg.innerHTML = ""; return; }
    var sc = FA.sc[cur], h = "", eL = pt(eng,"l"), eR = pt(eng,"r");
    for (var k=0;k<srcs.length;k++){ var d = curve(pt(srcs[k],"r"), [eL[0], eL[1] + (k-1.5)*14]); h += '<path class="fa-p'+(k===cur?' on':'')+'" id="fap'+k+'" d="'+d+'"/>'; }
    for (var j=0;j<acts.length;j++){ var on = sc.acts.indexOf(j)>-1, d2 = curve([eR[0], eR[1] + (j-2.5)*10], pt(acts[j],"l")); h += '<path class="fa-p'+(on?' on':'')+'" id="faq'+j+'" d="'+d2+'"/>'; }
    if (!REDUCE){
      for (var n=0;n<3;n++) h += '<circle class="fa-pk" r="4" visibility="hidden"><set attributeName="visibility" to="visible" begin="'+(n*0.6)+'s"/><animateMotion dur="1.8s" begin="'+(n*0.6)+'s" repeatCount="indefinite"><mpath href="#fap'+cur+'"/></animateMotion></circle>';
      sc.acts.forEach(function(j,idx){ for (var n=0;n<2;n++) h += '<circle class="fa-pk" r="3.6" visibility="hidden"><set attributeName="visibility" to="visible" begin="'+(1.8+idx*0.25+n*0.9)+'s"/><animateMotion dur="1.8s" begin="'+(1.8+idx*0.25+n*0.9)+'s" repeatCount="indefinite"><mpath href="#faq'+j+'"/></animateMotion></circle>'; });
    }
    svg.innerHTML = h;
  }
  function select(k){
    cur = k; var sc = FA.sc[k];
    for (var i=0;i<srcs.length;i++){ srcs[i].classList.toggle("on", i===k); srcs[i].setAttribute("aria-pressed", String(i===k)); }
    for (var j=0;j<acts.length;j++) acts[j].classList.toggle("on", sc.acts.indexOf(j)>-1);
    box.querySelector("#fa-s").textContent = lang==="bn" ? sc.sbn : sc.sen;
    box.querySelector("#fa-i").textContent = lang==="bn" ? sc.ibn : sc.ien;
    box.querySelector("#fa-a").textContent = sc.acts.map(function(j){ return nm(FA.act[j]); }).join(", ");
    eng.classList.remove("run"); void eng.offsetWidth; eng.classList.add("run");
    draw();
  }
  for (var i=0;i<srcs.length;i++){ (function(b){ b.addEventListener("click",function(){ user = true; clearInterval(aiTimer); select(+b.getAttribute("data-k")); }); })(srcs[i]); }
  if (aiRO) aiRO.disconnect();
  if (window.ResizeObserver){ aiRO = new ResizeObserver(function(){ draw(); }); aiRO.observe(box); }
  select(0);
  setTimeout(draw, 400);
  clearInterval(aiTimer);
  if (!REDUCE) aiTimer = setInterval(function(){ if (!user) select((cur+1)%4); }, 5500);
}

function initMap(){
  var cv = document.getElementById("bdmap"); if (!cv) return;
  var ctx = cv.getContext("2d");
  var pts = []; for (var i=0;i<MAP.p.length;i+=2) pts.push([MAP.p[i],MAP.p[i+1]]);
  var seed = 11; function rnd(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }
  var hot = [], used = {}; while (hot.length < 300){ var k = Math.floor(rnd()*pts.length); if (!used[k]){ used[k]=1; hot.push({p:pts[k],ph:rnd()*6.28,f:.6+rnd()*1.4,flash:0}); } }
  var W,H,s,ox,oy,dpr,base = document.createElement("canvas");
  var WR = [MAP.dc, MAP.dr];
  function X(c){ return ox + c*s; } function Y(r){ return oy + r*s; }
  function size(){
    var r = cv.getBoundingClientRect(); if (!r.width) return;
    dpr = Math.min(2, window.devicePixelRatio||1); W = r.width; H = r.height;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    s = Math.min((W-70)/(MAP.cols+4), (H-40)/(MAP.rows+5));
    ox = (W - 44 - MAP.cols*s)/2 + 4; oy = 26 + 2*s;
    base.width = cv.width; base.height = cv.height;
    var b = base.getContext("2d"); b.setTransform(dpr,0,0,dpr,0,0); b.clearRect(0,0,W,H);
    // graticule
    b.strokeStyle = "rgba(127,147,167,.16)"; b.lineWidth = 1; b.setLineDash([2,5]);
    b.fillStyle = "rgba(127,147,167,.75)"; b.font = "10px 'IBM Plex Mono', monospace";
    for (var lat=21; lat<=26; lat++){ var rr = (MAP.maxy-lat)/MAP.step, y = Y(rr); b.beginPath(); b.moveTo(X(-2),y); b.lineTo(X(MAP.cols+2),y); b.stroke(); b.fillText(num(lat)+"°N", X(MAP.cols+2)+6, y+3); }
    for (var lon=89; lon<=92; lon++){ var cc = (lon-MAP.minx)*MAP.k/MAP.step, x = X(cc); b.beginPath(); b.moveTo(x,Y(-2)); b.lineTo(x,Y(MAP.rows+2)); b.stroke(); b.fillText(num(lon)+"°E", x-14, Y(-2)-8); }
    b.setLineDash([]);
    // base dots
    var rad = Math.max(0.9, s*0.26);
    b.fillStyle = "rgba(179,195,210,.30)";
    for (var j=0;j<pts.length;j++){ b.beginPath(); b.arc(X(pts[j][0]),Y(pts[j][1]),rad,0,6.283); b.fill(); }
  }
  size();
  if (ro) ro.disconnect();
  if (window.ResizeObserver){ ro = new ResizeObserver(function(){ size(); if (REDUCE) draw(0); }); ro.observe(cv); }
  /* Graticule labels use the web font; rebuild the base layer once it has loaded. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (cv.isConnected){ size(); if (REDUCE) draw(0); } });
  var sig = [], rings = [], last = 0, spawnAcc = 0;
  /* Signals are stored in grid units so they stay on the map when the canvas is resized. */
  function spawn(){
    var h = hot[Math.floor(Math.random()*hot.length)]; h.flash = 1;
    var x0 = h.p[0], y0 = h.p[1], x2 = WR[0], y2 = WR[1];
    var mx = (x0+x2)/2, my = (y0+y2)/2, dx = x2-x0, dy = y2-y0, len = Math.sqrt(dx*dx+dy*dy)||1;
    var bend = (Math.random()<.5?-1:1) * len * (.18+Math.random()*.2);
    sig.push({x0:x0,y0:y0,cx:mx - dy/len*bend, cy:my + dx/len*bend, x2:x2,y2:y2,t:0,sp:.00045+Math.random()*.00035});
  }
  function q(sg,u){ var a=1-u; return [X(a*a*sg.x0+2*a*u*sg.cx+u*u*sg.x2), Y(a*a*sg.y0+2*a*u*sg.cy+u*u*sg.y2)]; }
  function draw(ts){
    if (!s) return;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(base,0,0);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var rad = Math.max(1.1, s*0.3);
    for (var i=0;i<hot.length;i++){
      var h = hot[i], a = .35 + .45*Math.abs(Math.sin(ts*.0006*h.f + h.ph)) + h.flash*.6;
      if (h.flash>0) h.flash = Math.max(0, h.flash - .02);
      ctx.fillStyle = "rgba(228,194,127,"+Math.min(1,a).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(X(h.p[0]),Y(h.p[1]),rad + h.flash*2,0,6.283); ctx.fill();
    }
    for (var j=sig.length-1;j>=0;j--){
      var sg = sig[j], u0 = Math.max(0, sg.t-.28), steps = 14;
      for (var k=0;k<steps;k++){
        var ua = u0 + (sg.t-u0)*k/steps, ub = u0 + (sg.t-u0)*(k+1)/steps, pa = q(sg,ua), pb = q(sg,ub);
        ctx.strokeStyle = "rgba(228,194,127,"+(.05 + .55*(k/steps)).toFixed(3)+")"; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]); ctx.stroke();
      }
      var hd = q(sg, sg.t); ctx.fillStyle = "#F3DDAE"; ctx.beginPath(); ctx.arc(hd[0],hd[1],1.9,0,6.283); ctx.fill();
    }
    // war room
    var wx = X(WR[0]), wy = Y(WR[1]);
    for (var r=rings.length-1;r>=0;r--){ var g = rings[r]; ctx.strokeStyle = "rgba(195,154,81,"+g.a.toFixed(3)+")"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(wx,wy,g.r,0,6.283); ctx.stroke(); }
    ctx.save(); ctx.translate(wx,wy); ctx.rotate(Math.PI/4);
    ctx.fillStyle = "#0A1726"; ctx.fillRect(-9,-9,18,18);
    ctx.strokeStyle = "#E4C27F"; ctx.lineWidth = 1.6; ctx.strokeRect(-9,-9,18,18);
    ctx.fillStyle = "#E4C27F"; ctx.fillRect(-3.5,-3.5,7,7);
    ctx.restore();
  }
  function frame(ts){
    var dt = last ? Math.min(60, ts-last) : 16; last = ts;
    spawnAcc += dt; if (spawnAcc > 150 && sig.length < 30){ spawnAcc = 0; spawn(); }
    for (var j=sig.length-1;j>=0;j--){ sig[j].t += sig[j].sp*dt; if (sig[j].t >= 1){ sig.splice(j,1); if (rings.length<6) rings.push({r:10,a:.8}); } }
    for (var r=rings.length-1;r>=0;r--){ rings[r].r += dt*.035; rings[r].a -= dt*.0011; if (rings[r].a<=0) rings.splice(r,1); }
    draw(ts); raf = visible ? requestAnimationFrame(frame) : 0;
  }
  /* Stop animating while the hero is scrolled out of view. */
  var visible = true;
  if (mapIO) mapIO.disconnect();
  if (window.IntersectionObserver && !REDUCE){
    mapIO = new IntersectionObserver(function(en){ visible = en[en.length-1].isIntersecting; if (visible && !raf){ last = 0; raf = requestAnimationFrame(frame); } });
    mapIO.observe(cv);
  }
  if (REDUCE){ for (var z=0;z<18;z++){ spawn(); sig[sig.length-1].t = .5 + Math.random()*.45; } rings.push({r:18,a:.5}); draw(0); }
  else { for (var z2=0;z2<10;z2++){ spawn(); sig[sig.length-1].t = Math.random()*.9; } raf = requestAnimationFrame(frame); }
}

/* ---------------- Methodology loop ---------------- */
function initLoop(){
  var svg = document.querySelector(".loopsvg"); if (!svg) return;
  var R = 160, cx = 260, cy = 260, C = 2*Math.PI*R;
  var prog = document.getElementById("lprog"), comet = document.getElementById("comet"), ls = document.getElementById("lstage");
  var nodes = svg.querySelectorAll(".node"), btns = document.querySelectorAll("#sbtn button[data-i]"), play = document.getElementById("play");
  var p = 0, playing = !REDUCE, last = 0, cur = -1, DUR = 6500;
  function setPlay(){ play.innerHTML = '<span aria-hidden="true">'+(playing ? "❚❚" : "▶")+'</span> '+(playing ? t("pause") : t("play")); }
  /* On narrow screens the outer labels become unreadable; zoom the viewBox onto the ring and rely on the stage buttons for names. */
  function fit(){ var c = svg.getBoundingClientRect().width < 480; svg.classList.toggle("compact", c); svg.setAttribute("viewBox", c ? "60 60 400 400" : "-110 40 740 440"); }
  fit();
  if (window.ResizeObserver){ if (loopRO) loopRO.disconnect(); loopRO = new ResizeObserver(fit); loopRO.observe(svg.parentNode); }
  function panel(i){
    var s = STAGES[i];
    document.getElementById("pk").innerHTML = ico("st"+i,18)+'<span>'+t("stage")+" "+num("0"+(i+1))+" / "+num("05")+'</span>';
    document.getElementById("pt").textContent = nm(s);
    document.getElementById("pd").textContent = ds(s).split(lang==="bn"?"। ":". ")[0]+(lang==="bn"?"।":".");
    var pa = document.getElementById("pa"); pa.innerHTML = ACTS[i].map(function(a,j){ return '<li style="animation-delay:'+(j*0.06)+'s"><i></i>'+(lang==="bn"?a[1]:a[0])+'</li>'; }).join("");
    document.getElementById("pc").innerHTML = s.rel.map(function(id){ var pr = prBy(id); return '<a class="chip" href="#g-'+id+'">'+ico(id,16)+'<span class="c">'+pr.code+'</span>'+nm(pr)+'</a>'; }).join("");
    ls.textContent = nm(s);
    for (var k=0;k<nodes.length;k++){ nodes[k].classList.toggle("on", k===i); nodes[k].classList.toggle("done", k<i); }
    for (var b=0;b<btns.length;b++) btns[b].setAttribute("aria-pressed", String(b===i));
  }
  function place(){
    var a = (-90 + p*72) * Math.PI/180;
    comet.setAttribute("transform","translate("+(cx+R*Math.cos(a)).toFixed(2)+" "+(cy+R*Math.sin(a)).toFixed(2)+")");
    prog.setAttribute("stroke-dasharray", (C*p/5).toFixed(1)+" "+C.toFixed(1));
    var i = Math.floor(p+1e-6)%5; if (i!==cur){ cur = i; panel(i); }
  }
  function go(i){ p = i; playing = false; setPlay(); cur = -1; place(); }
  for (var k=0;k<nodes.length;k++){ (function(n){ n.addEventListener("click",function(){ go(+n.getAttribute("data-i")); }); n.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(+n.getAttribute("data-i")); } }); })(nodes[k]); }
  for (var b=0;b<btns.length;b++){ (function(bt){ bt.addEventListener("click",function(){ go(+bt.getAttribute("data-i")); }); })(btns[b]); }
  play.addEventListener("click",function(){ playing = !playing; last = 0; setPlay(); });
  setPlay(); place();
  var fb = document.querySelector(".flowbox"); if (fb && fb.scrollWidth > fb.clientWidth) fb.scrollLeft = (fb.scrollWidth - fb.clientWidth)/2;
  function frame(ts){ var dt = last ? Math.min(60, ts-last) : 16; last = ts; if (playing){ p += dt/DUR; if (p>=5) p -= 5; place(); } loopRaf = requestAnimationFrame(frame); }
  loopRaf = requestAnimationFrame(frame);
}

/* ---------------- Router ---------------- */
var hdr = document.getElementById("hdr"), app = document.getElementById("app"), ftr = document.getElementById("ftr");
var current = "home", booted = false, lastHash = null;
var skip = document.getElementById("skip");
function toTop(y){ try { window.scrollTo({top:y||0,left:0,behavior:"instant"}); } catch(e) { window.scrollTo(0,y||0); } }
function reveal(el, smooth){
  el.scrollIntoView({behavior:smooth && !REDUCE ? "smooth" : "auto",block:"start"});
  if (el.classList.contains("dentry")){ el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl"); }
}
/* Keep the active page pill visible in the horizontally scrolling subnav, and fade whichever edge has more links. */
function initSubnav(){
  var nav = hdr.querySelector(".subnav"), sc = nav && nav.querySelector(".wrap"); if (!sc) return;
  function edges(){ nav.classList.toggle("more-l", sc.scrollLeft > 4); nav.classList.toggle("more-r", sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4); }
  var a = sc.querySelector('[aria-current="page"]');
  if (a && sc.scrollWidth > sc.clientWidth){ var ar = a.getBoundingClientRect(), sr = sc.getBoundingClientRect(); sc.style.scrollBehavior = "auto"; sc.scrollLeft += (ar.left - sr.left) - (sr.width - ar.width)/2; sc.style.scrollBehavior = ""; }
  edges(); sc.addEventListener("scroll", edges, {passive:true});
}
function render(page, anchor, keepScroll){
  cancelAnimationFrame(raf); cancelAnimationFrame(loopRaf); cancelAnimationFrame(aiRaf); clearInterval(aiTimer); raf = loopRaf = 0;
  [aiRO, ro, mapIO, loopRO].forEach(function(o){ if (o) o.disconnect(); }); aiRO = ro = mapIO = loopRO = null;
  current = page;
  document.documentElement.lang = lang;
  document.title = (page === "home" ? "" : t(NAVKEY[page === "detail" ? "services" : page]) + " · ") + t("site") + " (" + (lang === "bn" ? "এসিএস" : "ACS") + ")";
  skip.textContent = t("skip");
  hdr.innerHTML = header(page);
  var y = window.scrollY;
  app.innerHTML = '<div class="page'+(keepScroll ? ' still' : '')+'">'+P[page]()+nextBar(page)+'</div>';
  ftr.innerHTML = footer();
  bind();
  initSubnav();
  if (page==="home") initMap();
  if (page==="methodology") initLoop();
  if (page==="home"||page==="technology") initAI();
  if (keepScroll){ toTop(y); }
  else {
    /* Move focus to the new content so keyboard and screen-reader users land on the page they chose. */
    if (booted) app.focus({preventScroll:true});
    var el = anchor && document.getElementById(anchor);
    if (el){ toTop(0); setTimeout(function(){ reveal(el, booted); }, 30); }
    else toTop(0);
  }
  booted = true;
}
function bind(){
  hdr.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click",function(){ if (lang===b.dataset.lang) return; lang = b.dataset.lang; try{ localStorage.setItem("acs-lang",lang); }catch(e){} render(current,null,true); }); });
  var f = document.getElementById("enquiry"); if (f){
    var checks = [["f-name","e-name","f_err_name",function(v){ return v.trim().length > 1; }],
                  ["f-phone","e-phone","f_err_phone",function(v){ return v.replace(/\D/g,"").length >= 8; }]];
    var check = function(c){ var el = document.getElementById(c[0]), ok = c[3](el.value); el.setAttribute("aria-invalid", String(!ok)); document.getElementById(c[1]).textContent = ok ? "" : t(c[2]); return ok; };
    checks.forEach(function(c){ document.getElementById(c[0]).addEventListener("input",function(){ if (this.getAttribute("aria-invalid")==="true") check(c); }); });
    f.addEventListener("submit",function(e){
      e.preventDefault(); var n = document.getElementById("fnote"), bad = null;
      checks.forEach(function(c){ if (!check(c) && !bad) bad = document.getElementById(c[0]); });
      n.hidden = false; n.style.color = bad ? "#B3261E" : "";
      n.textContent = bad ? t("f_err_sum") : t("f_note");
      if (bad) bad.focus();
    });
  }
}
/* Back/forward fires popstate and (for hash changes) hashchange; only route once per URL change. */
function route(){ var h = (location.hash||"").slice(1) || "home"; if (h === lastHash) return; routeTo(h); }
function routeTo(h){
  lastHash = h;
  var page = h || "home", anchor = null;
  if (h.indexOf("s-")===0 || h.indexOf("g-")===0){ page = "detail"; anchor = h; }
  if (!P[page]) page = "home";
  if (page===current && anchor){ var el = document.getElementById(anchor); if (el){ reveal(el, true); return; } }
  render(page, anchor);
}
document.addEventListener("click", function(e){
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  var a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a) return;
  var h = a.getAttribute("href").slice(1); if (!h) return;
  e.preventDefault();
  if (h === "main"){ app.focus({preventScroll:true}); return; }
  go(h);
});
function go(h){
  try { if (location.hash.slice(1) !== h) history.pushState(null, "", "#"+h); } catch(err) {}
  routeTo(h);
}
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);
current = "";
route();
})();
</script>
